<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin Todo List</title>
</head>
<body>
  <header>
    <h1>Odin Todo List</h1>
  </header>

  <div class="sidebar">
    <div class="header-container">
      <h2>Projects</h2>
      <button title="Add">Add</button>
    </div>

    <ul>
      <li><button>Final Exam</button></li>
      <li><button>Thesis</button></li>
    </ul>
  </div>

  <div class="content">
    <div class="header-container">
      <h2>Todos</h2>
      <button title="Add">Add</button>
    </div>

    <div class="todo">
      <div class="header-container">
        <label class="todo-label">
          <input type="checkbox" name="completed">
          <h3>Study SVM</h3>
        </label>

        <div class="button-container">
          <button>Edit</button>
          <button>Delete</button>
        </div>
      </div>

      <p>Learn linear and nonlinear kernels, gutters, etc.</p>

      <div class="rating-date-container">
        <p>Rating: 5</p>
        <p>Due Date: 11:59 am, June 13, 2025</p>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 Aquibul Haq Chowdhury
  </footer>
</body>
</html>
